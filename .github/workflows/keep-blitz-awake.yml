name: Keep Blitz Awake

on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Login and visit Pencari
        env:
          PENCARI_PASSWORD: ${{ secrets.PENCARI_PASSWORD }}
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage();

            console.log('Opening Pencari...');

            await page.goto(
              'https://pencarimovie-server.pencarimovie.blitz.cloud/',
              {
                waitUntil: 'domcontentloaded',
                timeout: 30000
              }
            );

            console.log('Password page loaded');

            const inputs = page.locator('input');

console.log('Input count:', await inputs.count());

await inputs.first().fill(process.env.PENCARI_PASSWORD);

console.log('Password entered');

await page.locator('button').first().click();

            await page.waitForTimeout(5000);

            console.log('Current URL:', page.url());
            console.log('Page title:', await page.title());

            await page.waitForTimeout(10000);

            await browser.close();

            console.log('Done.');
          })();
          EOF
