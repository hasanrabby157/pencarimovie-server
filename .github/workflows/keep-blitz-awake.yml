name: Keep Blitz Awake

on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Inspect Pencari Login Page
        env:
          PENCARI_PASSWORD: ${{ secrets.PENCARI_PASSWORD }}
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage();

            console.log('Opening Pencari...');

            await page.goto(
              'https://pencarimovie-server.pencarimovie.blitz.cloud/',
              {
                waitUntil: 'domcontentloaded',
                timeout: 30000
              }
            );

            console.log('Password page loaded');

            await page.waitForTimeout(3000);

            console.log('Page URL:', page.url());
            console.log('Page title:', await page.title());

            console.log('--- PAGE HTML START ---');
            console.log(
              (await page.locator('body').innerHTML()).slice(0, 10000)
            );
            console.log('--- PAGE HTML END ---');

            await browser.close();

            console.log('Inspection complete.');
          })();
          EOF
